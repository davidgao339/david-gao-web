<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Statement Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-color: #ff4b4b;
      --bg-color: #ffffff;
      --secondary-bg-color: #f0f2f6;
      --text-color: #31333F;
      --font-family: "Source Sans Pro", sans-serif;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 300px;
      background-color: var(--secondary-bg-color);
      padding: 2rem;
      box-sizing: border-box;
      height: 100%;
      overflow-y: auto;
    }
    .main-content {
      flex: 1;
      padding: 3rem;
      background-color: var(--bg-color);
      overflow-y: auto;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-top: 0;
    }
    .st-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .st-button:hover {
      background-color: #ff3333;
    }
    .st-file {
      margin-bottom: 1.5rem;
      border: 1px dashed #ccc;
      padding: 2rem;
      text-align: center;
      border-radius: 0.25rem;
      cursor: pointer;
    }
    .st-file:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .spinner {
      display: none;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .result-container {
      display: none;
      margin-top: 2rem;
    }
    .metrics {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: var(--secondary-bg-color);
      padding: 1.5rem;
      border-radius: 0.5rem;
      flex: 1;
      text-align: center;
    }
    .metric-title {
      font-size: 0.875rem;
      color: #666;
    }
    .metric-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--text-color);
    }
    .chart-container {
      width: 100%;
      height: 300px;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Settings</h2>
  
  <div class="st-file" onclick="triggerAnalyze()">
    <label>Drag and drop CSV here</label>
    <div style="font-size: 0.75rem; color: #888;">Limit 200MB per file</div>
  </div>

  <button class="st-button" onclick="triggerAnalyze()">Analyze Statement</button>
</div>

<div class="main-content">
  <h1>📊 Bank Statement Analyzer</h1>
  <p>Automatically parse and categorize transactions from Ozon and Sberbank CSV exports. Gain instant business intelligence insights.</p>
  
  <div class="spinner" id="loadingSpinner"></div>

  <div class="result-container" id="resultArea">
    
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-title">Total Revenue</div>
        <div class="metric-value">$42,500</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Total Expenses</div>
        <div class="metric-value">$31,200</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Net Profit</div>
        <div class="metric-value">$11,300</div>
      </div>
    </div>

    <h3>Income vs Expenses (Monthly)</h3>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>

  </div>
</div>

<script>
  function triggerAnalyze() {
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('loadingSpinner').style.display = 'block';
    
    setTimeout(() => {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      renderChart();
    }, 1500);
  }

  let chartInstance = null;
  function renderChart() {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [
          {
            label: 'Revenue',
            data: [12000, 19000, 15000, 22000, 28000, 32000],
            backgroundColor: '#4bc0c0'
          },
          {
            label: 'Expenses',
            data: [10000, 15000, 14000, 18000, 22000, 24000],
            backgroundColor: '#ff6384'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }
</script>

</body>
</html>
