<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      if (path.startsWith('/demo/inventory-app/')) {
        window.location.replace('/demo/inventory-app/index.html');
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">davidgao.ca</a>...</p>
  </body>
</html>
