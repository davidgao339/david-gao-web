<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waves - Find Your True Love</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Space Container -->
  <div class="space-background">
    
    <!-- Main Holographic Card -->
    <main class="ui-card" id="input-card">
      <div class="card-header">
        <span class="tab-label">WAVELENGTH INPUT</span>
      </div>

      <div class="card-content">
        <!-- Left Column: Branding & Form -->
        <section class="left-section">
          <div class="brand">
            <h1 class="logo-title">WAVES</h1>
            <p class="logo-subtitle">find your true love</p>
          </div>

          <form class="input-grid">
            <div class="form-group">
              <label for="your-name">YOUR NAME:</label>
              <input type="text" id="your-name" maxlength="30" autocomplete="off" placeholder="e.g. Romeo">
            </div>

            <div class="form-group">
              <label for="partner-name">PARTNER'S NAME:</label>
              <input type="text" id="partner-name" maxlength="30" autocomplete="off" placeholder="e.g. Juliet">
            </div>

            <div class="form-group">
              <label>YOUR BIRTHDAY:</label>
              <div class="date-selects">
                <select id="m-day"></select>
                <select id="m-month"></select>
                <select id="m-year"></select>
              </div>
            </div>

            <div class="form-group">
              <label>PARTNER'S BIRTHDAY:</label>
              <div class="date-selects">
                <select id="f-day"></select>
                <select id="f-month"></select>
                <select id="f-year"></select>
              </div>
            </div>
          </form>
          
          <div id="calc-error" class="error-msg hidden">Please enter valid dates (MM/DD/YYYY).</div>
        </section>

        <!-- Vertical Divider Line -->
        <div class="divider"></div>

        <!-- Right Column: Actions -->
        <section class="right-section">
          <div class="icon-container">
            <div class="yin-yang-orb">
              <span class="symbol">🌊</span> <!-- Decorative Symbol -->
            </div>
          </div>

          <div class="toggle-group">
            <span class="toggle-label">SEXUAL COMPATIBILITY</span>
            <label class="custom-checkbox">
              <input type="checkbox" id="sex-compat-toggle" checked>
              <span class="checkmark">✓</span>
            </label>
          </div>

          <button type="button" id="calc-btn" class="analyze-btn">BEGIN ANALYSIS</button>
        </section>
      </div>
    </main>

    <!-- Results Holographic Card -->
    <main class="ui-card results-card hidden" id="results-card">
      <div class="card-header">
        <span class="tab-label">ANALYSIS RESULTS</span>
      </div>

      <!-- FINAL VERDICT BANNER -->
      <div class="verdict-banner">
        <h2>OVERALL COMPATIBILITY</h2>
        <div id="final-verdict" class="verdict-text"></div>
      </div>

      <div class="results-grid">
        <!-- SECTION 1: CHAKRAS -->
        <section class="result-section">
          <h3>Compatibility Resonance</h3>
          
          <div id="chakra-bars" class="chakra-bars"></div>
        </section>

        <!-- SECTION 2: ZODIAC -->
        <section class="result-section">
          <h3>Zodiac Compatibility</h3>
          
          <div class="zodiac-signs">
            <div class="zodiac-person">
              <div id="zodiac-name-male" class="zodiac-person-name"></div>
              <div id="zodiac-sign-male" class="zodiac-sign-name"></div>
              <div id="zodiac-element-male" class="zodiac-element"></div>
            </div>
            <div class="zodiac-vs">VS</div>
            <div class="zodiac-person">
              <div id="zodiac-name-female" class="zodiac-person-name"></div>
              <div id="zodiac-sign-female" class="zodiac-sign-name"></div>
              <div id="zodiac-element-female" class="zodiac-element"></div>
            </div>
          </div>
          
          <div id="zodiac-harmony" class="zodiac-harmony"></div>
          
          <div class="zodiac-role-card">
            <div id="zodiac-role-title" class="zodiac-role-title"></div>
            <div id="zodiac-role-desc" class="zodiac-role-desc"></div>
            <div id="zodiac-pair-text" class="zodiac-pair-text"></div>
          </div>
        </section>
      </div>

      <div style="text-align:center; margin-top:30px;">
        <button type="button" id="back-btn" class="analyze-btn" style="background:rgba(255,255,255,0.05); border:1px solid rgba(135,206,250,0.3); color:#fff; width:100%; max-width:300px; margin:0 auto; transition:all 0.3s;">← RECALCULATE</button>
      </div>
    </main>

  </div>

  <!-- Wave Transition Overlay -->
  <div id="wave-transition" class="wave-overlay hidden">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
  </div>

  <script src="calc.js"></script>
  <script src="script.js"></script>
</body>
</html>
